name: SkillForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Django System Checks
      env:
        DJANGO_SECRET_KEY: ci-test-secret-key-12345
        DJANGO_DEBUG: "False"
      run: |
        cd backend
        python manage.py check

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Build
      run: |
        cd frontend
        npm run build
