services:
  # SkillForge Backend Web Service (Django + DRF)
  - type: web
    name: skillforge-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --chdir backend --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3-flash-preview"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  # SkillForge Frontend Static Site (React + Vite)
  - type: web
    name: skillforge-frontend
    env: static
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
